name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: alaviss/setup-nim@0.1.1
        with:
          path: nim
          version: version-2-2

      - name: Add gcc and nimble shims to PATH
        shell: bash
        run: |
          # gcc for the C backend (preinstalled MSYS2 mingw64 on windows runners)
          echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"
          # nimble installs package shims (nimpacker.cmd) here
          echo "$(cd ~ && pwd -W)/.nimble/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (winim, nimpacker)
        run: |
          nimble install -y https://github.com/khchen/winim
          nimble install -y https://github.com/bung87/nimpacker

      - name: Build and package (nimble dist)
        run: nimble dist

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
