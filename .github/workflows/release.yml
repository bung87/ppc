name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # setup-nim-action is unreliable; download the official Windows build instead
      - name: Install Nim 2.2.4
        shell: bash
        run: |
          curl -fSL -o nim.zip https://nim-lang.org/download/nim-2.2.4_x64.zip
          unzip -q nim.zip
          # pwd -W: forward-slash Windows path (mixed separators can break PATH prepending)
          echo "$(cd nim-2.2.4 && pwd -W)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (winim, nimpacker)
        run: nimble install -d -y

      - name: Build and package (nimble dist)
        run: nimble dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
